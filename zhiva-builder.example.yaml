# App id: organization/name
id: wxn0brP/my-app

# Command to execute before packaging
build:
    cmd: "bun run build"

# Artifacts to include in the final distribution archive
files:
    - "dist"
    - "package.json"
    - "zhiva.json"
    - "README.md"

# Output configuration for the generated release files
output:
    name: "my-app-release"
    dir: "./releases"

# Environment variables to set
env:
    "TEST_ENV": "test"

# Standalone executable options (all size reductions are on by default)
compile:
    # Remove unused Bun and Node.js APIs from the binary
    trim: true
    # Or keep only selected ICU locales and APIs:
    # trim:
    #     locales: ["en", "pl"]
    #     allow: ["sqlite"]
    # Compile JS/TS to machine code at build time (host platform only)
    aot: true
    # Drop function source code from AOT binaries
    functionSource: false
    # Strip function and file names, source maps are removed after build
    obfuscate: true

# Linux-specific packaging rules
linux:
    # Compressed archive formats to generate
    format:
        - "zip"
        - "tar.gz"
        - "tar.xz"
        - "7z"
    # System package formats to build via FPM (https://github.com/jordansissel/fpm)
    fpm:
        - "pacman"
        - "deb"
        - "rpm"

# Windows-specific packaging rules
win32:
    format:
        - "zip"
    # arch: "x64"

# macOS-specific packaging rules
darwin:
    format:
        - "zip"
    # arch: "arm64"
